# Adapted from Drexel-UHC/cdc-correctional-facilities-hcv's quarto.yml, itself from
# quarto-dev/quarto-actions examples.
#
# One job, quarto-deploy: on push to main, render the site and publish it to gh-pages.
# The publish action renders before it publishes, so a broken page fails the run and
# nothing is published.
#
# The whole repo is the site, so the paths filter is an ignore list: pushes that touch
# only non-site files (Claude config, the legacy docs/ build, the README, deploy.bat)
# don't trigger a deploy.
#
# No R install: the one executable page (blog/2025-09-09-duckdb-wasm-proof-of-concept) is
# frozen (`execute: freeze: auto`, _freeze/ committed), so CI never runs R. Editing that page
# without re-rendering locally makes it try to execute here and fail — the signal to run
# `quarto render` locally and commit _freeze/.
#
# CNAME is listed under project.resources in _quarto.yml, so the custom domain survives
# every publish to gh-pages.

name: Quarto

on:
  push:
    branches: main
    paths-ignore:
      - ".claude/**"
      - "docs/**"
      - "README.md"
      - "deploy.bat"

concurrency:
  group: quarto-deploy
  cancel-in-progress: false

jobs:
  quarto-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Render and publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
